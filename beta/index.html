<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C3C3C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#C3C3C0;--surface:#DCDCD9;--nav:#CFCFCC;--border:rgba(40,40,38,.14);
  --text:#2B2B29;--text2:#56564F;--faint:#8C8C87;--accent:#A87D3E;--on-accent:#FBF7EE;
  --income:#44633F;--expense:#963F32;--sun:#8A524B;--sat:#4B6176;
  --serif:'Manrope',-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
  --sans:'Manrope',-apple-system,'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(110px + env(safe-area-inset-bottom));position:relative}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px 20px;margin-bottom:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h1{font-family:var(--serif);font-size:26px;font-weight:700;margin:0}
.big{font-family:var(--serif);font-size:38px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{color:var(--text2);font-size:12.5px}
.inc{color:var(--income)}.exp{color:var(--expense)}
.mini{display:flex;gap:12px;margin-bottom:16px}
.mini .card{flex:1;margin:0;padding:14px 16px;min-width:0}
.mini .v{font-family:var(--serif);font-size:18px;font-weight:700;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.nav-month{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border)}
svg{display:block}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{text-align:center;font-size:11px;color:var(--text2);padding:4px 0 8px;font-weight:600}
.dow div:first-child,.cell.sun .d{color:var(--sun)}.dow div:last-child,.cell.sat .d{color:var(--sat)}
.cell{min-height:56px;padding:4px 1px;border-radius:10px;text-align:center;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px}
.cell .d{font-size:13px;font-weight:600}
.cell.out .d{color:var(--faint)!important}
.cell.today{border-color:var(--accent)}
.cell .e,.cell .i{font-size:9.5px;line-height:1.2;font-weight:600;white-space:nowrap}
.cell .e{color:var(--expense)}.cell .i{color:var(--income)}
.cell:active{background:rgba(58,53,44,.06)}
.cell.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.daypanel{margin-top:4px}
/* 設定: 題名を押すと開く */
.fold:not(.open)>*:not(.foldhd){display:none!important}
.foldhd{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:2px 0;font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.foldhd b{font-size:16px}
.foldhd .chev{font-size:22px;line-height:1;color:var(--text2);transition:transform .15s ease}
.fold.open>.foldhd .chev{transform:rotate(90deg)}
.fold.open>.foldhd{margin-bottom:10px}
.foldhd.solo{background:var(--surface);border-radius:18px;padding:16px 20px;margin:0 0 12px}
.foldhd.solo b{font-size:16px}
.fold.open>.foldhd.solo{margin-bottom:14px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:calc(84px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--nav);border-radius:22px 22px 0 0;border-top:1px solid var(--border);display:flex;z-index:20}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:600;color:var(--text2);text-decoration:none}
.nav a.on{color:var(--accent)}
.nav .ico{width:22px;height:22px}
.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(104px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 20px rgba(58,53,44,.25);z-index:15}
.fab .ico{width:26px;height:26px;stroke-width:2}
.tabs{display:flex;background:var(--nav);border-radius:14px;padding:4px;margin:12px 0 16px}
.tabs a{flex:1;text-align:center;padding:8px;border-radius:11px;font-weight:700;font-size:13px;color:var(--text2);text-decoration:none}
.tabs a.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(58,53,44,.12)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border);width:100%;text-align:left}
.tx:first-child{border-top:0}
.cat{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#FBF7EE;font-weight:700;font-size:14px;flex:none}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:7px;background:var(--nav);color:var(--text2);margin-right:5px}
.tag.warn{background:#E8D5B8;color:#7A5520}
.amt{font-family:var(--serif);font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:12px 18px;font-weight:700;width:100%}
.btn.ghost{background:var(--nav);color:var(--text)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px}
.btn.danger{background:none;color:var(--expense);border:1px solid var(--expense)}
.bar{height:10px;border-radius:6px;background:var(--nav);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.legend{display:grid;gap:9px;margin-top:14px}
.legend div{display:flex;align-items:center;gap:9px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span:nth-child(2){flex:1}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{padding:7px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;white-space:nowrap;color:var(--text2)}
.chip.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.sheet-bg{position:fixed;inset:0;background:rgba(58,53,44,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:12px;color:var(--text2);font-weight:600;margin-bottom:5px}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg)}
.seg{display:flex;background:var(--nav);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:700;font-size:13px;color:var(--text2)}
.seg button.on{background:var(--surface);color:var(--text)}
.ins{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px}
.empty{text-align:center;padding:30px 10px;color:var(--text2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom));background:var(--text);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60}
.ok{color:var(--income)}

/* ===== 押した感触 ===== */
button,a,.cell,.tx{touch-action:manipulation}
.btn,.chip,.icon-btn,.fab,.cell,.tx,.nav a,.tabs a,.seg button,.tag,.selbar button{transition:transform .09s ease,filter .09s ease,background-color .12s ease,box-shadow .12s ease}
.btn:active{transform:scale(.97);filter:brightness(.88)}
.btn.ghost:active{filter:brightness(.93)}
.chip:active{transform:scale(.94);filter:brightness(.9)}
.icon-btn:active{transform:scale(.88);filter:brightness(.9)}
.fab:active{transform:scale(.9);box-shadow:0 2px 6px rgba(0,0,0,.28);filter:brightness(.9)}
.cell:active{transform:scale(.93);background:var(--nav)}
.tx:active{background:var(--nav)}
.nav a:active{transform:scale(.9);filter:brightness(.8)}
.tabs a:active,.seg button:active{transform:scale(.95);filter:brightness(.92)}
.selbar button:active{transform:scale(.94);filter:brightness(1.25)}
/* ===== 横にスライドして確認済み ===== */
.swipe{position:relative;overflow:hidden;border-top:1px solid var(--border)}
.swipe:first-child{border-top:0}
.swipe .tx{border-top:0;position:relative;background:var(--surface);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--income);color:var(--surface);font-weight:700;font-size:13px;opacity:.8;transition:opacity .15s,filter .15s}
.swipe.armed .swipe-bg{opacity:1;filter:brightness(.9)}
/* ===== まとめて選択 ===== */
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--on-accent);flex:none;transition:background-color .12s,border-color .12s}
.chk.on{background:var(--accent);border-color:var(--accent)}
.tx.picked{background:rgba(168,125,62,.14)}
.tx[data-hs]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.chk{touch-action:none}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:456px;background:var(--text);color:var(--surface);border-radius:20px;padding:14px 10px 10px;display:flex;flex-direction:column;align-items:stretch;gap:10px;z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.selbar .selcount{text-align:center}
.selbar span{font-size:14px;font-weight:700;white-space:nowrap}
.selbar .selbtns{display:flex;align-items:center;gap:6px}
.selbar .selbtns button{flex:1 1 auto}
.selbar button{padding:10px 6px;border-radius:12px;font-size:12px;font-weight:700;color:inherit;background:rgba(127,127,127,.28);white-space:nowrap}
.selbar button.off{opacity:.4;pointer-events:none}
.toast button{margin-left:12px;font-weight:700;text-decoration:underline;color:inherit}

/* ===== 共通(スマホでは、PC用の部品は隠す) ===== */
.shell{display:block}
.side,.dsk{display:none}
.statrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.statrow .card{margin:0;padding:14px 16px;min-width:0}
.statrow .bigc{grid-column:1/3;padding:18px 20px}
.statrow .v{font-family:var(--serif);font-size:18px;font-weight:700;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cell.sel{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:var(--accent)}
.btn svg{display:inline-block;vertical-align:middle;margin-right:4px}
/* ===== パソコン用の画面(幅960px以上) ===== */
@media (min-width:960px){
  body{display:block}
  #app{max-width:none;padding:0;min-height:100vh}
  .shell{display:flex;min-height:100vh;align-items:stretch}
  .side{display:flex;flex-direction:column;flex:0 0 232px;background:var(--nav);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;box-sizing:border-box}
  .brand{display:flex;align-items:center;gap:10px;font-size:14px;margin:2px 6px 20px}
  .brand .logo{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
  .brand .logo .ico{width:15px;height:15px}
  .addbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:13px;box-shadow:0 8px 16px rgba(0,0,0,.18);margin-bottom:20px;transition:transform .09s ease,filter .09s ease,box-shadow .12s ease}
  .addbtn .ico{width:16px;height:16px;stroke-width:2.4}
  .addbtn:active{transform:scale(.97);filter:brightness(.9);box-shadow:0 3px 8px rgba(0,0,0,.2)}
  .sidenav{display:flex;flex-direction:column;gap:3px}
  .sidenav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:13px;font-weight:600;color:var(--text2);text-decoration:none;transition:background-color .12s,transform .09s}
  .sidenav a:active{transform:scale(.97)}
  .sidenav a.on{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:700}
  .sidenav .ico{width:18px;height:18px}
  .grow{flex:1}
  .side-status{border-top:1px solid var(--border);padding-top:14px;display:flex;align-items:center;gap:10px;font-size:12px}
  .side-status .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
  .side-status .dot.on{background:var(--income)}
  .side-status .t{flex:1;min-width:0}
  .main{flex:1;min-width:0;padding:30px 36px 60px;max-width:1280px;box-sizing:border-box}
  .main.narrow{max-width:900px}
  .nav,.fab{display:none}
  .dsk{display:block}
  .h1{font-size:24px}
  .nav-month{justify-content:flex-start;gap:14px}
  .nav-month .dsk{margin-left:auto}
  /* 収支のカード */
  .statrow{grid-template-columns:1.4fr 1fr 1fr;gap:14px;margin-bottom:18px}
  .statrow .bigc{grid-column:auto}
  .statrow .big{font-size:36px}
  .statrow .v{font-size:22px}
  /* カレンダー + 選んだ日の詳細 */
  .calwrap{display:flex;gap:22px;align-items:flex-start}
  .calcol{flex:1;min-width:0}
  .daypanel{flex:0 0 340px;position:sticky;top:24px}
  .calcard{padding:16px!important}
  .cell{min-width:0;overflow:hidden}
  .dow,.grid{gap:6px}
  .cell{min-height:84px;padding:8px;border-radius:12px;align-items:flex-start;text-align:left;border-width:1.5px}
  .cell .d{font-size:12px}
  .cell .d + *{margin-top:auto}
  .cell .e,.cell .i{font-size:10px;padding:2px 6px;border-radius:6px}
  .cell .e{background:color-mix(in srgb,var(--expense) 13%,transparent)}
  .cell .i{background:color-mix(in srgb,var(--income) 13%,transparent)}
  .cell.today .d{font-weight:800}
  /* 設定・サブスクは2列 */
  .main.cols{column-count:2;column-gap:20px}
  .main.cols .h1,.main.cols .tabs,.main.cols .nav-month,.main.cols .mini,.main.cols .keep{column-span:all}
  .main.cols .card{break-inside:avoid}
  /* レポート(3列) */
  .rep3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch;margin-bottom:18px}
  .rep3 .card{margin:0}
  .rep2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  .rep2 .card{margin:0}
  .sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}
  .sumrow .card{margin:0;padding:16px 20px}
  .sumrow .v{font-family:var(--serif);font-size:24px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
  /* ダイアログ・通知 */
  .sheet-bg{align-items:center}
  .sheet{border-radius:24px}
  .selbar{bottom:24px;left:calc(50% + 116px)}
  .toast{bottom:28px;left:calc(50% + 116px)}
}
@media (min-width:960px) and (max-width:1180px){
  .main{padding:26px 24px 60px}
  .calwrap{flex-direction:column}
  .calcol,.daypanel{width:100%;flex:none}
  .daypanel{position:static}
  .rep3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .statrow .big{font-size:30px}
}
/* ===== マウスを乗せたときの見た目(マウスのある端末だけ) ===== */
@media (hover:hover){
  .btn:hover:not(:active){filter:brightness(.95)}
  .chip:hover:not(:active){filter:brightness(.95);border-color:var(--faint)}
  .icon-btn:hover:not(:active){filter:brightness(.93)}
  .tx:hover:not(:active){background:var(--nav)}
  .cell:hover:not(:active){background:var(--nav)}
  .sidenav a:hover:not(.on){background:color-mix(in srgb,var(--text) 8%,transparent)}
  .tabs a:hover:not(.on){filter:brightness(.95)}
  button,.chip,.cell,.tx,.sidenav a{cursor:pointer}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ========= 定数 ========= */
const DEFAULT_CARDPAY = ['ニコス','ＪＣＢ','ジェーシービー','三井住友カード','ＳＭＢＣ','ラクテンカード','楽天カード','エポス','ＤＣカード','ＵＣカード','ＰａｙＰａｙカード','ペイペイカード','アメリカンエキスプレス','イオンカード','トヨタファイナンス','オリコ','セゾン','ビューカード','クレジット'];     // 銀行の明細で、カード代金の引き落としに出る言葉(店名や摘要に含まれるもの)
const DEFAULT_ALLOW = [];     // お小遣いを送ってくれる人(これ以外から受け取ったお金は、お小遣いにならず、立替金になる)
const allowKws = () => { const a = S.settings.allowKw; return Array.isArray(a) ? a : DEFAULT_ALLOW; };
const INCOME_CATS = ['収入','お小遣い','立替金','その他収入','個人間送金'];     // 収入のカテゴリー(支出のカテゴリーとは別)
const BASE_CATS = {食費:'#566E85',交通:'#935F3D',日用品:'#4C756E',娯楽:'#827A3F',旅行:'#2F7F86',住居:'#8C5570',サブスク:'#7B6A99',その他:'#6B6585'};
const CATS = Object.create(null), CAT_NAMES = [];      // 「constructor」などの名前が、カテゴリーとして見つかってしまわないように、土台のない入れ物にする
const knownCat = c => typeof c==='string' && (!!CATS[c] || INCOME_CATS.includes(c));      // 表示用(初期のカテゴリー + 自分で追加したもの)。rebuildCats() で作り直す
const INCOME_COLOR = '#5F7A58';
const POINT_TYPES = ['投資','ポイント、残高の獲得'];
const P2P_TYPES = ['受け取った金額','送った金額'];
const SMALL_KANA = {'ァ':'ア','ィ':'イ','ゥ':'ウ','ェ':'エ','ォ':'オ','ッ':'ツ','ャ':'ヤ','ュ':'ユ','ョ':'ヨ','ヮ':'ワ','ヵ':'カ','ヶ':'ケ'};

function parseDate(s){

  const m = String(s).match(/(\d{4})年(\d{1,2})月(\d{1,2})日(?:\s*(\d{1,2})時(\d{1,2})分)?/) || String(s).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(!m) return null;
  return {day:`${m[1]}-${pad(m[2])}-${pad(m[3])}`, time:m[4]!=null?`${pad(m[4])}:${m[5]}`:''};
}

function buildCanon(list){
  const csv = new Set(), mails = new Set();
  list.forEach(t=>{ const k = nk(kn(t.merchant||'')); if(!k) return; if(/^(?:ufj|card|bank)_csv/.test(String(t.source||''))) csv.add(k); else if(/^(?:ufj|card|bank)_mail/.test(String(t.source||''))) mails.add(k); });

}

    if(t.csrc!=='explicit' && (keys.has(k) || dk)){
      t.category = 'サブスク'; if(t.csrc==='none'){ t.csrc = 'auto'; t.review = t.status==='needs_review'; }
    }
    if(dk && t.category==='サブスク') t.subDefKey = dk;
  });
  return list;
}
function all(){
  const del = new Set(S.overlay.deleted), rawAll = [...S.base, ...S.overlay.added].filter(t=>t && typeof t==='object' && !del.has(t.id) && !(String(t.id) in Object.prototype));      // 「constructor」などのIDは、使わない(設定の入れ物を、壊されないように)
  buildCanon(rawAll);
  return applySubCat(applyOffsets(dropMailDuplicates(rawAll.map(norm))))
    .sort((a,b)=> (a.day+a.time) < (b.day+b.time) ? 1 : -1);
}
/* 収支集計の対象か(ポイントは常に除外、個人間送金は設定次第) */
const counts = t => t.group==='main' || (t.group==='p2p' && S.settings.p2pIn!==false);
/* 取り込み元の表示名。自分で名前を付けたカード・口座は「card_csv:三井住友カード」のように、名前を後ろに持つ */
const srcLabel = s => { const m = /^(?:card|bank)_(?:csv|mail):(.+)$/.exec(String(s||'')); if(m) return m[1];
  return ({paypay_ocr:'PayPay',paypay_ocr_win:'PayPay',paypay_csv:'PayPay',ufj_csv:'三菱UFJ',ufj_mail:'三菱UFJ',manual:'手入力'}[s]||s); };
const isBankSrc = src => /^(?:ufj|bank_)/.test(String(src||''));          // 銀行口座(入金もある)。カードは、支払いだけ
const sum = (arr,f) => arr.reduce((a,t)=>a+(f(t)?t.value:0),0);
/* 入金のうち収入に数える金額(incOf)と、支払いから引く金額(offOf)。立替金は収入にならず、支払いを減らす */
const incOf = t => t.value>0 ? (t.incAmt!==undefined ? t.incAmt : (t.offsetOf ? 0 : t.value)) : 0;
const offOf = t => (t.value>0 && t.offsetOf) ? (t.offAmt!==undefined ? t.offAmt : t.value) : 0;
const inc = arr => arr.filter(counts).reduce((a,t)=>a+incOf(t),0);
const exp = arr => arr.filter(counts).reduce((a,t)=>a+(t.value<0?-t.value:0)-offOf(t),0);
const spendByCat = (arr,by={}) => { arr.filter(counts).forEach(t=>{ if(t.value<0) by[t.category] = (by[t.category]||0) - t.value; else if(offOf(t)) { (t.offList||[{cat:t.offsetCat,amt:offOf(t)}]).forEach(x=>{ const c = x.cat||'その他'; by[c] = (by[c]||0) - x.amt; }); } }); Object.keys(by).forEach(k=>{ if(by[k]<=0) delete by[k]; }); return by; };

const app = document.getElementById('app');
function route(){ const h=location.hash.replace(/^#\/?/,'').split('/'); return {p:h[0]||'cal', a:h[1]}; }
/* 接続リンク: アプリのURLの後ろに  #/connect/<base64url({url,key})>  を付けて開くと、URLと合言葉が自動で設定される */
function handleConnectLink(){
  const {p,a} = route(); if(p!=='connect'||!a) return false;
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(a.replace(/-/g,'+').replace(/_/g,'/')))));
    if(o.url&&o.key){
      let host = ''; try{ const u = new URL(String(o.url)); if(u.protocol==='https:') host = u.host; }catch(e){}
      history.replaceState(null,'',location.pathname+'#/sync');
      if(!host){ toast('接続リンクが正しくありません(https:// ではない接続先は、使えません)'); return false; }
      // 偽のリンクで、勝手に接続先(データの送り先)を書き換えられないように、必ず確認する
      const now = cloud() ? ' (いまの接続先: '+(()=>{ try{ return new URL(S.cloud.url).host; }catch(e){ return S.cloud.url; } })()+')' : '';
      if(!confirm('接続先を「'+host+'」にします。自分で作ったデータの置き場所のときだけ、OKしてください。'+now)) return false;
      connectCloud(o.url,o.key); toast('接続しました'); return true;
    }
  }catch(e){ toast('接続リンクが正しくありません'); }
  return false;
}
const isDesk = () => !!(window.matchMedia && window.matchMedia('(min-width:960px)').matches);
/* 金額の文字が、カードの幅に収まらないときは、収まるまで小さくする(下限は、もとの大きさの55%) */
function fitAmounts(){
  if(typeof document==='undefined' || !document.querySelectorAll || typeof getComputedStyle==='undefined') return;
  document.querySelectorAll('.card .v, .card .big').forEach(e=>{
    e.style.fontSize = '';
    if(!e.clientWidth) return;
    const base = parseFloat(getComputedStyle(e).fontSize) || 16, min = base*.55;
    let f = base;
    while(e.scrollWidth > e.clientWidth + 0.5 && f > min){ f -= 0.5; e.style.fontSize = f + 'px'; }
  });
}

/* ----- グラフ(インラインSVG) ----- */
function donut(data,total){
  const R=70,C=2*Math.PI*R; let off=0;
  const arcs = data.map(([k,v])=>{ const len=v/total*C; const s=`<circle r="${R}" cx="90" cy="90" fill="none" stroke="${CATS[k]||CATS['その他']}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`; off+=len; return s; }).join('');
  return `<svg viewBox="0 0 180 180" style="width:180px;margin:6px auto"><circle r="${R}" cx="90" cy="90" fill="none" stroke="var(--nav)" stroke-width="26"/>${arcs}<text x="90" y="86" text-anchor="middle" font-size="11" fill="var(--text2)">支出合計</text><text x="90" y="108" text-anchor="middle" font-size="17" font-weight="600" font-family="var(--serif)" fill="var(--text)">${yen(total)}</text></svg>`;
}
function bars(vals,labels,hi,future){
  const W=320,H=150,max=Math.max(...vals,1),bw=W/vals.length;
  return `<svg viewBox="0 0 ${W} ${H+22}" style="width:100%">${vals.map((v,i)=>{ const h=Math.max(v/max*H,future[i]?H*.12:2), x=i*bw+bw*.17, w=bw*.66;
    return future[i]?`<rect x="${x}" y="${H-h}" width="${w}" height="${h}" rx="4" fill="none" stroke="var(--faint)" stroke-dasharray="3 3"/>`:`<rect x="${x}" y="${H-h}" width="${w}" height="${h}" rx="4" fill="${i===hi?'var(--accent)':'#8F9AA3'}"/>`;}).join('')}
    ${labels.map((l,i)=>`<text x="${i*bw+bw/2}" y="${H+15}" text-anchor="middle" font-size="9.5" fill="var(--text2)">${l}</text>`).join('')}</svg>`;
}
function line(vals,labels){
  const W=320,H=140,min=Math.min(0,...vals),max=Math.max(...vals,1),rng=max-min||1;
  const X=i=>vals.length>1?26+i*(W-52)/(vals.length-1):W/2, Y=v=>H-(v-min)/rng*(H-14)-4;
  const pts = vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  const area = `${X(0)},${H} ${pts} ${X(vals.length-1)},${H}`;

/* ===== CSVの取り込み(PayPay / 三菱UFJ)。import_csv.py と同じルール・同じID ===== */
function md5(str){                       // UFJのCSVは行内容のMD5からIDを作る(Python版と同じIDにするため)
  const bytes = new TextEncoder().encode(str), len = bytes.length, padLen = (((len+8)>>6)+1)*64;
  const buf = new Uint8Array(padLen); buf.set(bytes); buf[len] = 0x80;
  const dv = new DataView(buf.buffer); dv.setUint32(padLen-8, (len<<3)>>>0, true); dv.setUint32(padLen-4, len>>>29, true);
  const S_ = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const K = new Int32Array(64); for(let i=0;i<64;i++) K[i] = Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0;
  let a0=0x67452301|0, b0=0xefcdab89|0, c0=0x98badcfe|0, d0=0x10325476|0;
  const M = new Int32Array(16);
  for(let off=0; off<padLen; off+=64){
    for(let j=0;j<16;j++) M[j] = dv.getInt32(off+j*4, true);
    let A=a0, B=b0, C=c0, D=d0;
    for(let i=0;i<64;i++){
      let F, g;
      if(i<16){ F=(B&C)|(~B&D); g=i; }
      else if(i<32){ F=(D&B)|(~D&C); g=(5*i+1)%16; }
      else if(i<48){ F=B^C^D; g=(3*i+5)%16; }
      else { F=C^(B|~D); g=(7*i)%16; }
      F = (F + A + K[i] + M[g])|0; A=D; D=C; C=B;
      B = (B + ((F<<S_[i])|(F>>>(32-S_[i]))))|0;
    }
    a0=(a0+A)|0; b0=(b0+B)|0; c0=(c0+C)|0; d0=(d0+D)|0;
  }
  const hex = n => { let t=''; for(let i=0;i<4;i++) t += ((n>>>(i*8))&255).toString(16).padStart(2,'0'); return t; };
  return hex(a0)+hex(b0)+hex(c0)+hex(d0);
}
function parseCsv(text){
  const rows = []; let row = [], f = '', q = false;
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q = true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); f=''; rows.push(row); row=[]; }
    else f += c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x!==''));
}
const csvInt = v => { const d = String(v||'').replace(/[^0-9]/g,''); return d ? parseInt(d,10) : null; };
const pyJson = o => '{'+Object.entries(o).map(([k,v])=>JSON.stringify(k)+': '+JSON.stringify(v)).join(', ')+'}';   // Pythonの json.dumps と同じ書き方
function csvObjects(rows, required){
  const head = rows[0].map(h=>h.trim());
  const missing = required.filter(c=>!head.includes(c));
  if(missing.length) return {error:'想定の列が見つかりません: '+missing.join('、')+'(CSVの形式が変わった可能性があります)'};
  return {list: rows.slice(1).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]!==undefined?r[i]:''])))};
}
function parsePaypayCsv(rows){
  const o = csvObjects(rows,['取引日','出金金額（円）','入金金額（円）','取引内容','取引先','取引番号']);
  if(o.error) return o;
  const W='出金金額（円）', D='入金金額（円）';
  // 1つの取引番号に、複数の行が付くことがある(支払い+ポイント獲得、支払い+返金など)。
  // その場合は行ごとに別のIDにする(取引番号だけだと、片方が「重複」として捨てられてしまうため)
  const count = {}, usedIds = {};
  o.list.forEach(r=>{ const n=(r['取引番号']||'').trim(); if(n) count[n]=(count[n]||0)+1; });
  return {records:o.list.map(row=>{
    const w = csvInt(row[W]), d = csvInt(row[D]);
    const no = (row['取引番号']||'').trim();
    let id = !no ? 'paypay_csv_'+md5(pyJson(row)).slice(0,12)
      : count[no]>1 ? 'paypay_csv_'+no+'_'+md5([row['取引内容'],row[W],row[D]].map(x=>x||'').join('|')).slice(0,6)
      : 'paypay_csv_'+no;
    if(usedIds[id]){ usedIds[id]++; id += '-'+usedIds[id]; } else usedIds[id] = 1;      // 完全に同じ内容の行が2つあっても、別々に残す
    return {id,
      date:row['取引日']||'', merchant:row['取引先']||'', amount: w!==null?row[W]:(d!==null?row[D]:''),
      amount_value: w!==null?-w:(d!==null?d:null), transaction_type:row['取引内容']||'', status:'confirmed', source:'paypay_csv', raw:pyJson(row)};
  })};
}
function parseUfjCsv(rows){
  const o = csvObjects(rows,['日付','摘要','摘要内容','支払い金額','預かり金額','入払区分']);
  if(o.error) return o;
  return {records:o.list.map(row=>{
    const p = csvInt(row['支払い金額']), d = csvInt(row['預かり金額']);
    const detail = (row['摘要内容']||'').trim();
    const merchant = (detail || row['摘要'] || '').replace(/^[0-9０-９]+\u3000/,'');
    const key = [row['日付'],row['摘要'],row['摘要内容'],row['支払い金額'],row['預かり金額'],row['差引残高']||'',row['入払区分']].map(x=>x||'').join('|');
    return {id:'ufj_csv_'+md5(key).slice(0,12), date:row['日付']||'', merchant, amount: p!==null?row['支払い金額']:(d!==null?row['預かり金額']:''),

/* ===== 汎用のCSV: クレジットカードの明細・ほかの銀行/デビットカード ===== */
const GCSV = {
  date: ['利用日','ご利用日','お取引日','取引日','利用年月日','ご利用年月日','日付','年月日','決済日','計上日','お支払日'],
  merchant: ['利用店名・商品名','ご利用店名・商品名','ご利用店名','利用店名','ご利用先','利用先','利用店','加盟店名','店名','お取引内容','取引内容','摘要内容','ご利用内容','利用内容','お支払先','支払先','摘要','内容'],
  amount: ['利用金額','ご利用金額','お支払い金額','お支払金額','請求金額','ご請求金額','今回請求額','支払総額','金額','支払金額'],
  out: ['出金金額','出金額','ご出金金額','お引出金額','引出金額','お支払い金額','支払い金額','出金'],
  inn: ['入金金額','入金額','ご入金金額','お預り金額','お預入金額','預かり金額','預入金額','入金'],
};
const pickCol = (head, names) => { for(const n of names){ const i = head.indexOf(n); if(i>=0) return i; } return -1; };
function normDate(v){
  const t = String(v||'').normalize('NFKC').trim();
  let m = t.match(/(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
  if(!m){ const n = t.match(/^(\d{4})(\d{2})(\d{2})/); if(n) m = n; }
  return m ? `${m[1]}/${pad(+m[2])}/${pad(+m[3])}` : '';
}
function gAmount(v){
  const t = String(v||'').normalize('NFKC').trim();
  if(!t) return null;
  const neg = /^[-−△▲(]/.test(t) || /^\(.*\)$/.test(t);
  const d = t.replace(/[^0-9]/g,'');
  return d ? (neg ? -parseInt(d,10) : parseInt(d,10)) : null;
}
function parseGenericCsv(rows){
  // 見出しの行を探す(上の数行の中で、「日付」の列と「金額」の列がそろっている行)
  let hi = -1, c = null;
  for(let i=0;i<Math.min(rows.length,12);i++){
    const head = rows[i].map(h=>String(h||'').normalize('NFKC').trim());
    const d = pickCol(head,GCSV.date), m = pickCol(head,GCSV.merchant), a = pickCol(head,GCSV.amount), o = pickCol(head,GCSV.out), n = pickCol(head,GCSV.inn);
    if(d>=0 && (a>=0 || o>=0 || n>=0)){ hi = i; c = {head,d,m,a,o,n}; break; }
  }
  if(hi<0) return {error:'日付と金額の列が見つかりませんでした。PayPay・三菱UFJ・クレジットカード・銀行のCSVとして読めません'};
  const bank = c.o>=0 || c.n>=0;          // 出金・入金の列があれば銀行口座、金額の列だけならカード(支払い)
  const list = [], occ = {};
  rows.slice(hi+1).forEach(r=>{
    const date = normDate(r[c.d]);
    if(!date) return;                       // 合計の行・注意書きなどは読み飛ばす
    const merchant = String(r[c.m]!==undefined ? r[c.m] : '').trim();
    let value = null, amountStr = '', type = '';
    if(bank){
      const o = gAmount(r[c.o]), i = gAmount(r[c.n]);
      if(o){ value = -Math.abs(o); amountStr = String(r[c.o]).trim(); type = '振替支払い'; }
      else if(i){ value = Math.abs(i); amountStr = String(r[c.n]).trim(); type = '振替入金'; }
    }else{
      const a = gAmount(r[c.a]);
      if(a){ value = a>0 ? -a : -a; amountStr = String(r[c.a]).trim().replace(/^[-−△▲]/,''); type = a>0 ? 'カード支払い' : '返金'; }     // カード明細の+は支払い、−は返金・取消
    }
    if(value===null) return;
    const row = Object.fromEntries(c.head.map((h,k)=>[h||('列'+(k+1)), r[k]!==undefined ? r[k] : '']));
    const key = r.map(x=>String(x||'')).join('|');
    occ[key] = (occ[key]||0)+1;
    list.push({date, merchant: merchant || '(店名なし)', value, amount: amountStr, type, row, key, n: occ[key]});
  });
  if(!list.length) return {error:'取り込める行がありませんでした'};
  return {generic:true, kind: bank ? 'bank' : 'card', list, sig: c.head.join('|'), head: c.head};
}
function makeGenericRecords(g, name){
  const source = `${g.kind}_csv:${String(name).replace(/[,\n]/g,' ').trim()}`;
  return g.list.map(x=>({id: `${g.kind}_csv_`+md5(name+'|'+x.key).slice(0,12)+(x.n>1?'-'+x.n:''), date:x.date, merchant:x.merchant, amount:x.amount,
    amount_value:x.value, transaction_type:x.type, status:'confirmed', source, raw:pyJson(x.row)}));

/* ファイルの中身から、PayPay(UTF-8) か 三菱UFJ(Shift-JIS) か、それ以外(カード・ほかの銀行)かを自動で見分ける */
function parseCsvFile(buf){
  let utf8 = null; try{ utf8 = new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){}
  if(utf8 && utf8.includes('取引番号')){ const r = parseCsv(utf8); return r.length ? parsePaypayCsv(r) : {error:'中身が空です'}; }
  let sj = null; try{ sj = new TextDecoder('shift_jis').decode(buf); }catch(e){}
  const t = (sj && sj.includes('入払区分')) ? sj : (utf8 && utf8.includes('入払区分') ? utf8 : null);
  if(t){ const r = parseCsv(t); return r.length ? parseUfjCsv(r) : {error:'中身が空です'}; }
  // それ以外: クレジットカード・ほかの銀行/デビットカードのCSV(UTF-8でもShift-JISでも)
  const txt = utf8 || sj;
  if(txt){ const r = parseCsv(txt); if(r.length){ const g = parseGenericCsv(r); if(!g.error) return g; if(sj && sj!==txt){ const g2 = parseGenericCsv(parseCsv(sj)); if(!g2.error) return g2; } return g; } }
  return {error:'CSVとして読めませんでした'};
}

/* ===== ほかの端末への送信(裏で順に送る。アプリを閉じても、次に開いたとき続きから送る) ===== */
let upBusy = false;
function upPill(){
  const n = S.overlay.added.filter(x=>x._up).length;
  let e = document.getElementById('up-pill');
  if(!n){ if(e) e.remove(); return; }
  if(!e){
    e = document.createElement('div'); e.id = 'up-pill';
    e.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.25);white-space:nowrap';
    document.body.appendChild(e);
  }
  e.textContent = `ほかの端末へ送信中… 残り${n}件`;
}
async function uploadQueued(){
  if(upBusy || !cloud()) return;
  upBusy = true; upPill();
  try{
    for(;;){
      const q = S.overlay.added.filter(x=>x._up).slice(0,40);
      if(!q.length) break;
      const body = q.map(({_up,...r})=>r);
      let ok = false;
      for(let a=0; a<3 && !ok; a++){
        try{ const res = await cloudFetch('/api/import',{method:'POST',body:JSON.stringify(body)}); ok = res.ok; }catch(e){}
        if(!ok) await new Promise(r=>setTimeout(r,2000*(a+1)));
      }
      if(!ok) break;                                    // 通信できないときは止める。次に開いたときや、再読み込みのときに続きから送る
      const ids = new Set(q.map(x=>x.id));
      S.overlay.added = S.overlay.added.filter(x=>!ids.has(x.id));
      const have = new Set(S.base.map(t=>t.id));
      S.base.push(...body.filter(r=>!have.has(r.id)));
      persist(); upPill();
    }
  }finally{ upBusy = false; upPill(); }
}
async function importCsvFiles(files){
  const recs = [], errs = [];
  for(const f of files){
    let r = parseCsvFile(await f.arrayBuffer());
    if(r.generic){ const name = await askGenericName(f.name, r); r = name ? {records: makeGenericRecords(r, name)} : {error:'取り込みをやめました'}; }
    if(r.error) errs.push(f.name+': '+r.error); else recs.push(...r.records);
  }
  if(errs.length) toast(errs[0]+(errs.length>1?` ほか${errs.length-1}件`:''));
  if(!recs.length) return;
  const known = new Set([...S.base,...S.overlay.added].map(t=>t.id)), seen = new Set(), fresh = [];
  recs.forEach(r=>{ if(!known.has(r.id)&&!seen.has(r.id)){ seen.add(r.id); fresh.push(r); } });
  const dup = recs.length - fresh.length;
  const skipPoints = S.settings.csvSkipPoints!==false;
  const isPoint = r => /ポイント/.test(r.transaction_type||'');
  const pointRows = skipPoints ? fresh.filter(isPoint).length : 0;
  if(pointRows){ for(let i=fresh.length-1;i>=0;i--) if(isPoint(fresh[i])) fresh.splice(i,1); }
  const detail = `読み込み ${recs.length}行 / すでにある ${dup}件${pointRows?` / ポイント関連 ${pointRows}件は除外`:''}`;
  if(!fresh.length){ toast(`新しい取引はありませんでした(${detail})`); return; }
  let ui = null;
  try{
    if(cloud()){
      // この端末にはすぐ表示し、Notion(ほかの端末)へは裏で順に送る。送り終わるまで、画面の下に進み具合を出す
      fresh.forEach(r=>{ r._up = 1; });
      S.overlay.added.push(...fresh); persist(); render(); upPill();
      toast(`${fresh.length}件を取り込みました。ほかの端末へは、順に送信します(${detail})`);
      uploadQueued();
    }else{
      S.overlay.added.push(...fresh); persist();
      if(LOCAL) await applyLocal(); else render();
      toast(`${fresh.length}件を取り込みました(${detail})`);
    }
  }catch(e){
    if(ui){ await loadLocal(true); importProgressEnd(ui,'取り込みに失敗しました',String(e.message||e)+`(${ui.done}件は取り込み済み)`,false); }
    else toast(String(e.message||e));
  }
}

/* ===== テーマ(背景の色から、文字・カード・収入/支出の色を自動で決める) ===== */
const THEMES = [['ライトグレー','#D4D4D1'],['グレー','#C3C3C0'],['ベージュ','#D9D4C9'],['青みグレー','#BFC5CC'],['ダークグレー','#3A3A38'],['ブラック','#1C1C1C']];
const hex2rgb = h => { h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); };
const rgb2hex = (r,g,b) => '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
function rgb2hsl(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2; let h=0, s=0;
  if(mx!==mn){ const d=mx-mn; s = l>.5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx===r ? (g-b)/d+(g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4; h/=6; }
  return [h,s,l];
}
function hsl2hex(h,s,l){
  const f = n => { const k=(n+h*12)%12, a=s*Math.min(l,1-l); return l-a*Math.max(-1,Math.min(k-3,9-k,1)); };
  return rgb2hex(f(0)*255,f(8)*255,f(4)*255);
}
const lumOf = hex => { const [r,g,b]=hex2rgb(hex).map(v=>{ v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); }); return .2126*r+.7152*g+.0722*b; };
const contrast = (a,b) => { const x=lumOf(a), y=lumOf(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
/* 背景に対して読みやすい(コントラストが基準以上になる)まで、明るさを動かして色を決める */
function readable(hue,sat,startL,bg,dark,min=4.5){
  let l = startL;
  for(let i=0;i<50;i++){ const c=hsl2hex(hue,sat,l); if(contrast(c,bg)>=min) return c; l += dark ? .02 : -.02; if(l<0||l>1) break; }
  return dark ? '#ffffff' : '#000000';
}
const mixHex = (a,b,t) => { const x=hex2rgb(a), y=hex2rgb(b); return rgb2hex(x[0]+(y[0]-x[0])*t, x[1]+(y[1]-x[1])*t, x[2]+(y[2]-x[2])*t); };
function makeTheme(bg){
  const [r,g,b] = hex2rgb(bg), [h,s] = rgb2hsl(r,g,b);
  const dark = lumOf(bg) < .19;                                // 白文字と黒文字で、読みやすさが入れ替わる明るさの境目
  const hs = Math.min(s,.12);                                  // 文字は、背景の色合いを少しだけ引き継ぐ
  const text = hsl2hex(h,hs,dark?.97:.04);
  let surface, nav;
  if(dark){                                                    // 暗い背景: カードは少し明るくするが、文字が読める範囲まで
    let t = .12;
    do{ surface = mixHex(bg,'#ffffff',t); t -= .01; }while(contrast(text,surface)<7 && t>=0);
    nav = mixHex(bg,surface,.5);
  }else{                                                       // 明るい背景: カードは背景に白を混ぜて、少し明るくする
    surface = mixHex(bg,'#ffffff',.30); nav = mixHex(bg,'#ffffff',.15);
  }
  const pal = dark ? {income:[.30,.35,.68],expense:[.02,.62,.70],sun:[.01,.40,.75],sat:[.58,.45,.72]}
                   : {income:[.31,.25,.31],expense:[.03,.50,.40],sun:[.02,.25,.40],sat:[.58,.25,.35]};
  const col = k => readable(pal[k][0],pal[k][1],pal[k][2],surface,dark);
  return {'--bg':bg,'--surface':surface,'--nav':nav,'--text':text,
    '--text2':readable(h,hs,dark?.72:.32,surface,dark), '--faint':readable(h,hs,dark?.55:.52,bg,dark,2.6),
    '--border':'rgba('+hex2rgb(text).join(',')+',.16)',

}
function applyTheme(){
  const bg = /^#[0-9a-f]{6}$/i.test(S.settings.theme||'') ? S.settings.theme : '#C3C3C0';
  const root = document.documentElement;
  for(const [k,v] of Object.entries(makeTheme(bg))) root.style.setProperty(k,v);

function setTheme(hex){ S.settings.theme = hex; applyTheme(); persist(); markSettings(); render(); }

/* ===== サブスク(定期的な引き落とし)の自動検出 ===== */
const SUB_EXCLUDE = /suica|スイカ|ケイタイケツサイ|pasmo|パスモ|icoca/i;   // 交通系ICは対象外
function addMonths(day,n,dom){
  const [y,m] = day.split('-').map(Number);
  const t = new Date(y,m-1+n,1), last = new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(Math.min(dom,last))}`;
}
function sameDom(a,b){            // 「同じ日」: 1〜2日のずれ(土日の繰り越し)と月末同士は同じ扱い
  const x=+a.slice(8), y=+b.slice(8);
  return Math.abs(x-y)<=2 || (x>=28&&y>=28);

function detectSubs(txs, kind){
  const income = kind==='income';

  txs.filter(t=>t.group==='main'&&(income ? t.value>0 : (t.value<0&&!SUB_EXCLUDE.test(String(t.merchant).normalize('NFKC'))))).forEach(t=>{
    const k = mkey(t.merchant); if(k) (groups[k] ??= []).push(t);
  });
  const out = [], todayS = ymd(today);
  for(const [k,list] of Object.entries(groups)){
    list.sort((a,b)=>a.day<b.day?-1:1);
    const u = list.filter((t,i)=>i===0||t.day!==list[i-1].day);     // 同じ日の複数回は1回に数える
    if(u.length<2) continue;
    const recent = u.slice(-3), pairs = [];
    for(let i=1;i<recent.length;i++){
      const a=recent[i-1], b=recent[i];
      pairs.push({mdiff:(+b.day.slice(0,4)-+a.day.slice(0,4))*12+(+b.day.slice(5,7)-+a.day.slice(5,7)), same:sameDom(a.day,b.day)});
    }
    let cycle = null;
    if(pairs.every(p=>p.mdiff===1&&p.same)) cycle='monthly';
    else if(pairs.every(p=>p.mdiff===12&&p.same)) cycle='yearly';
    if(!cycle) continue;
    const last = u[u.length-1];
    // 偶然の一致を避ける: 毎月は「3回以上」か「2回で金額が同じ」のときだけ
    // 収入(給料など)は金額が少し変わるので、2回なら「3割以内の差」でよいことにする
    const prev = u[u.length-2];
    if(cycle==='monthly' && u.length<3 && (income ? Math.abs(prev.value-last.value)/Math.abs(last.value)>.3 : prev.value!==last.value)) continue;
    const dom = +last.day.slice(8), next = addMonths(last.day, cycle==='monthly'?1:12, dom);
    const grace = cycle==='monthly' ? 7 : 20;
    const lateLimit = new Date(dayNum(next)*86400000 + grace*86400000);
    out.push({key:k, merchant:last.merchant, cycle, amount:Math.abs(last.value), category:last.category, dom, next,
              income, count:u.length, active: new Date(todayS+'T00:00:00') <= lateLimit, lastDay:last.day});
  }
  return out.sort((a,b)=>a.next<b.next?-1:1);
}
/* 履歴などで、カテゴリーを「サブスク」にした支払い(自動では見つからないもの)も、サブスクの一覧に出す */
function registeredSubs(txs, detKeys){
  const g = {};
  txs.filter(t=>t.group==='main'&&t.value<0&&t.category==='サブスク').forEach(t=>{
    const k = mkey(t.merchant); if(!k || (detKeys && detKeys.has(k))) return;
    const ek = t.subDefKey || (k+'#'+t.id);            // 登録したサブスクは1つの項目、自分で選んだ取引は1件ずつ別の項目
    (g[ek] ??= []).push(t);
  });
  const todayS = ymd(today), out = [];
  for(const [ek,l] of Object.entries(g)){
    l.sort((a,b)=>a.day<b.day?-1:1);
    const k = mkey(l[0].merchant), def = (S.settings.subDefs||[]).find(d=>defKey(d)===ek);
    const cyc = (def ? def.cycle : (S.settings.subCyc||{})[k])==='yearly' ? 'yearly' : 'monthly';
    const last = l[l.length-1], dom = +last.day.slice(8), next = addMonths(last.day, cyc==='yearly'?12:1, dom);
    out.push({key:ek, merchant:last.merchant, cycle:cyc, amount:-last.value, category:'サブスク', dom, next, income:false, count:l.length, manual:true,
              active: new Date(todayS+'T00:00:00') <= new Date(dayNum(next)*86400000 + (cyc==='yearly'?20:7)*86400000), lastDay:last.day});
  }
  return out;
}
function subLists(txs){
  const ign = new Set(S.settings.subIgnore||[]), gone = new Set(S.settings.subGone||[]);

  const all_ = [...det, ...registeredSubs(txs, new Set(detAll.map(x=>x.key))).filter(x=>!gone.has(x.key))].sort((a,b)=>a.next<b.next?-1:1);

    <label class="row" style="margin-bottom:12px"><span>銀行のカード代金の引き落としを、収支から除く</span><input type="checkbox" data-act="cardpay" ${S.settings.cardPayExclude===true?'checked':''} style="width:22px;height:22px"></label>
    <div class="sub" style="margin-bottom:6px;font-weight:700">引き落としと見なす言葉(店名・摘要に含まれるもの)</div>

  const themeCard = `<div class="card fold ${op('theme')}"><button class="foldhd" data-act="set-toggle" data-k="theme"><b>背景の色</b><span class="chev">›</span></button><div class="sub" style="margin:6px 0 12px">背景の色を選ぶと、文字やカードの色が、見やすいように自動で変わります。</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px">${THEMES.map(([n,c])=>`<button data-act="theme" data-c="${c}" style="width:64px;text-align:center;font-size:11px;font-weight:600"><span style="display:block;height:38px;border-radius:12px;background:${c};border:2px solid ${curTheme===c.toLowerCase()?'var(--accent)':'var(--border)'};margin-bottom:4px"></span>${n}</button>`).join('')}</div>
    <label class="row" style="margin-top:14px"><span>好きな色を選ぶ</span><input id="theme-color" type="color" value="${curTheme}" style="width:56px;height:36px;border:0;background:none;padding:0"></label></div>`;
  const bySrc = {}; txs.forEach(t=>{ const l=srcLabel(t.source); bySrc[l]=(bySrc[l]||0)+1; });
  const maxSrc = Math.max(1,...Object.values(bySrc));
  const registered = `<div style="margin-bottom:14px;padding:12px 14px;background:var(--nav);border-radius:14px"><div class="row"><span class="sub">いま登録されている取引</span><b style="font-size:20px;font-variant-numeric:tabular-nums">${txs.length}件</b></div>
    ${Object.entries(bySrc).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<div class="row sub" style="gap:8px;margin-top:6px"><span style="width:62px;flex:none">${esc(k)}</span><div class="bar" style="flex:1;height:8px;background:var(--bg)"><i style="width:${v/maxSrc*100}%;background:var(--accent)"></i></div><span style="min-width:48px;text-align:right;font-variant-numeric:tabular-nums">${v}件</span></div>`).join('')||'<div class="sub" style="margin-top:6px">まだありません</div>'}</div>`;
  const csvCard = `<div class="card fold ${op('csv')}"><button class="foldhd" data-act="set-toggle" data-k="csv"><b>CSVの取り込み</b><span class="chev">›</span></button><div class="sub" style="margin:6px 0 12px">PayPay・三菱UFJからダウンロードしたCSVを選ぶと、形式を自動で見分けて取り込みます(複数選択できます)。同じ取引は二重に登録されません。</div>
    ${registered}
    <label class="row" style="margin-bottom:12px"><span>ポイントの獲得・取消は取り込まない<div class="sub">収支に影響せず件数も多いので、除くと速くなります</div></span><input type="checkbox" data-act="skippoints" ${S.settings.csvSkipPoints!==false?'checked':''} style="width:22px;height:22px"></label>

  const canFS = 'showOpenFilePicker' in window;
  const pending = S.overlay.added.length+Object.keys(S.overlay.edits).length+S.overlay.deleted.length;
  const weakBanner = (cloudInfo && cloudInfo.weakKey) ? `<div class="card" style="border-color:#c0392b"><b>合言葉が短すぎます</b><div class="sub" style="margin-top:6px">いまの合言葉は16文字未満です。推測されやすいので、Cloudflareの APP_KEY を、24文字ほどのランダムな文字に変えてください(アプリの「合言葉」も、同じものにします)。最初の画面の「合言葉を作る」で作れます(<a href="#/setup">確認用の画面</a>)。</div></div>` : '';
  const relNotes = (RELEASE && RELEASE.id && RELEASE.notes && RELEASE.notes.length && S.meta.seenRelease!==RELEASE.id) ? `<div class="card"><b>${esc(RELEASE.title||'新しくなりました')}</b>
    <ul style="margin:8px 0 10px;padding-left:20px;line-height:1.8">${RELEASE.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul><button class="btn ghost sm" data-act="release-seen">閉じる</button></div>` : '';
  const updateBanner = workerOutdated() ? `<div class="card" style="border-color:var(--accent,#a77c3d)"><b>${workerRequired()?'データの置き場所の更新が必要です':'データの置き場所に、更新があります(任意)'}</b>

  const mailCard = `<div class="card fold ${op('mail')}"><button class="foldhd" data-act="set-toggle" data-k="mail"><b>メールの自動取り込み(Gmail)</b><span class="chev">›</span></button>

    ${workerOutdated()?`<div class="sub" style="color:#c0392b;margin-bottom:8px">先に、上の「データの置き場所の更新」をしてください(この機能は、新しい版が必要です)。</div>`:''}
    <ol style="margin:0 0 10px;padding-left:20px;line-height:1.9">

      <li>「実行ログ」に「設定できました」と出れば完了です。過去90日分を入れたいときは、関数「<b>backfill</b>」も実行してください</li>

    <div class="sub">対応: 三菱UFJ-JCBデビット、三井住友・楽天・JCB・PayPay・イオン・セゾン・エポスなどのカード。読み取れないメールは、飛ばします。</div></div>`;
  const tapCard = `<div class="card fold ${op('tap')}"><button class="foldhd" data-act="set-toggle" data-k="tap"><b>iPhoneの背面タップ(PayPayの取り込み)</b><span class="chev">›</span></button>

      <li>iPhoneで、このボタンを押して、ショートカットを追加する <a class="btn sm" style="display:inline-block;text-decoration:none" href="${SHORTCUT_URL}" target="_blank" rel="noopener">ショートカットを開く</a></li>
      <li>追加するときに、2つ聞かれます。下のボタンでコピーして、貼り付けてください。<br>
        <button class="btn ghost sm" data-act="tap-copy-url">アドレスをコピー</button> <button class="btn ghost sm" data-act="tap-copy-key">背面タップ用の合言葉をコピー</button><div class="sub" style="margin-top:4px">${cloudInfo&&(cloudInfo.version||1)>=4?'書き込み専用の鍵です(漏れても、データは読まれません)。':'先に、データの置き場所を更新すると、書き込み専用の安全な鍵になります。'}</div></li>
      <li>iPhoneの「設定」→「アクセシビリティ」→「タッチ」→「背面タップ」→「ダブルタップ」(または「トリプルタップ」)で、追加したショートカットを選ぶ</li>
      <li>PayPayの画面を開いて、背面をたたく。しばらくして、アプリの履歴に出れば成功です</li>
    </ol>
    <div class="sub">ショートカットが、画面の文字を読むために、最初に「許可」を聞くことがあります。許可してください。</div></div>`;
  const cloudCard = `<div class="card fold ${op('cloud')}"><button class="foldhd" data-act="set-toggle" data-k="cloud"><b>クラウド接続</b><span class="chev">›</span></button>
    <div class="sub" style="margin:6px 0 12px">${cloud()?'<span class="ok">接続中</span>(iPhoneでもPCでも、自動で読み込み・保存されます)':'中継役のURLと合言葉を入れると、どの端末でも自動で同期されます。'}</div>
    <label class="field"><span>中継役のURL</span><input id="c-url" value="${esc(S.cloud?.url||'')}" placeholder="https://kakeibo-xxxx.workers.dev"></label>
    <label class="field"><span>合言葉</span><input id="c-key" type="password" value="${esc(S.cloud?.key||'')}" placeholder="APP_KEY"></label>
    <button class="btn" data-act="connect">${cloud()?'接続し直す':'接続する'}</button>
    ${cloud()?`<button class="btn ghost" style="margin-top:10px" data-act="copy-connect-link">他の端末をつなぐリンクをコピー</button>
    <div class="sub" style="margin-top:6px">iPhoneなど、ほかの端末でこのリンクを開くと、アドレスと合言葉が自動で入ります。リンクには合言葉が入っているので、自分以外の人には、送らないでください。</div>
    <button class="btn ghost" style="margin-top:10px" data-act="disconnect">接続を解除</button>
    <div style="margin-top:16px;border-top:1px solid var(--line,#ddd);padding-top:12px"><b>保存先(データの置き場所)</b>
    <div class="sub" id="mig-status" style="margin:6px 0 10px">${esc(cloudInfoText())}</div>
    <button class="btn ghost sm" data-act="cloud-info">状態を確認</button> <button class="btn ghost sm" data-act="cloud-migrate">Cloudflareのデータベースへ引っ越す</button>
    <div class="sub" style="margin-top:8px">Notionの取引を、Cloudflare(D1)にコピーします。何度押しても二重にはなりません。コピーしたあと、Workerの変数 BACKEND を d1 にすると切り替わります。</div></div>`:''}</div>`;
  if(AUTO()) return `<h1 class="h1" style="margin:4px 0 14px">設定</h1>
  ${weakBanner}${relNotes}${updateBanner}
  <div class="card"><b>自動同期中</b><div class="sub" style="margin-top:6px">${cloud()?'クラウド':'このPCの家計簿サーバー'}から、自動で読み込み・保存しています。iPhone背面タップの取引も自動で反映されます。<br>最終読込: <span class="ok">${esc(S.meta.loadedAt||'-')}</span>(${S.base.length}件)${pending?`<br>未保存の変更: ${pending}件`:''}</div>
    <button class="btn ghost sm" style="margin-top:12px" data-act="reload-local">いま再読み込み</button> <button class="btn ghost sm" style="margin-top:12px" data-act="app-update">アプリを最新にする</button><div class="sub" style="margin-top:8px">画面が古いままのときに押してください(端末内のデータは消えません)。</div></div>
  ${csvCard}${incomeCard}${cardPayCard}${catCard}${themeCard}${tapCard}${mailCard}${cloudCard}
  <div class="card fold ${op('agg')}"><button class="foldhd" data-act="set-toggle" data-k="agg"><b>集計設定</b><span class="chev">›</span></button>
    <label class="row" style="margin-top:10px"><span>個人間送金を収支に含める<div class="sub">受け取った金額/送った金額</div></span><input type="checkbox" data-act="p2p" ${S.settings.p2pIn!==false?'checked':''} style="width:22px;height:22px"></label>
    <label class="row" style="margin-top:12px"><span>PayPayへのチャージ・ATMの引き出しを収支から除く<div class="sub">UFJからPayPayへの入金と、ATMで引き出したお金(二重に見えるため)。現金の支出は、自分で入力してください</div></span><input type="checkbox" data-act="transfer" ${S.settings.transfer!==false?'checked':''} style="width:22px;height:22px"></label>
    <div class="sub" style="margin-top:8px">ポイント(投資・ポイント獲得)は常に収支から除外し、履歴の「ポイント」で確認できます。</div></div>
  <div class="card"><b>状況</b><div class="sub" style="margin-top:6px">全 ${txs.length} 件 / 要確認 ${txs.filter(t=>t.review).length} 件</div></div>

  return `<h1 class="h1" style="margin:4px 0 14px">設定</h1>
  ${csvCard}${incomeCard}${cardPayCard}${catCard}${themeCard}${tapCard}${mailCard}${cloudCard}${viewSubs(txs)}
  <div class="card fold ${op('load')}"><button class="foldhd" data-act="set-toggle" data-k="load"><b>データ読み込み</b><span class="chev">›</span></button>
    <div class="sub" style="margin:6px 0 14px">Box上の transactions.json を読み込みます。${S.meta.loadedAt?`<br>最終読込: <span class="ok">${esc(S.meta.loadedAt)}</span>(${esc(S.meta.fileName||'')}、${S.base.length}件)`:''}</div>
    ${canFS?`<button class="btn" data-act="pick-fs">${S.meta.linked?'別のファイルを選ぶ':'transactions.json を選ぶ(自動更新あり)'}</button>
      ${S.handle?`<button class="btn ghost" style="margin-top:10px" data-act="reload">いま再読み込み</button>`:''}`
      :`<button class="btn" data-act="pick-input">ファイルAppから選ぶ</button>`}
    <input type="file" id="fin" accept=".json,application/json" hidden>
  </div>
  <div class="card fold ${op('export')}"><button class="foldhd" data-act="set-toggle" data-k="export"><b>書き出し</b><span class="chev">›</span></button><div class="sub" style="margin:6px 0 14px">${pending} 件の未反映の変更があります(カテゴリー編集・手入力など)。</div>
    <button class="btn ghost" data-act="save">${S.handle&&canFS?'transactions.json に保存':'JSONを書き出す(共有/保存)'}</button></div>
  <div class="card fold ${op('agg')}"><button class="foldhd" data-act="set-toggle" data-k="agg"><b>集計設定</b><span class="chev">›</span></button>
    <label class="row" style="margin-top:10px"><span>個人間送金を収支に含める<div class="sub">受け取った金額/送った金額</div></span><input type="checkbox" data-act="p2p" ${S.settings.p2pIn!==false?'checked':''} style="width:22px;height:22px"></label>
    <label class="row" style="margin-top:12px"><span>PayPayへのチャージ・ATMの引き出しを収支から除く<div class="sub">UFJからPayPayへの入金と、ATMで引き出したお金(二重に見えるため)。現金の支出は、自分で入力してください</div></span><input type="checkbox" data-act="transfer" ${S.settings.transfer!==false?'checked':''} style="width:22px;height:22px"></label>
    <div class="sub" style="margin-top:8px">ポイント(投資・ポイント獲得)は常に収支から除外し、履歴の「ポイント」で確認できます。</div></div>

    <button class="btn ghost sm" style="margin-top:12px" data-act="sample">サンプルデータで試す</button> <button class="btn danger sm" style="margin-top:12px" data-act="clear">端末内データを消去</button></div>`;

/* ========= 編集シート ========= */
function openSheet(id,day){
  const t = id ? all().find(x=>x.id===id) : null;
  const isIncome = t ? t.value>0 : false;
  const d = t ? t.day : (day || ymd(today));
  const rp = !!t && t.value>0 && t.type==='受け取った金額';       // 人から受け取ったお金(立替金・お小遣い)
  let dir = isIncome?1:-1, cat = t && t.csrc!=='none' && !rp ? t.category : null, scope = 'all', cyc = (t && (S.settings.subCyc||{})[mkey(t.merchant)]==='yearly') ? 'yearly' : 'monthly';
  const cat0 = cat;
  const chips = () => (dir>0?INCOME_CATS:CAT_NAMES).map(c=>`<button class="chip ${cat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  const bg = document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet"><div class="row" style="margin-bottom:14px"><h2 class="h1" style="font-size:20px">${t?'取引を編集':'取引を追加'}</h2><button class="icon-btn" data-x>✕</button></div>
    ${t?.review?`<div class="sub" style="margin-bottom:12px">${t.status==='needs_review'?'支払い完了画面を検出できなかった取引です。内容を確認してください。':'カテゴリーを選んで確定してください。'}</div>`:''}
    <div class="seg"><button data-dir="-1" class="${isIncome?'':'on'}">支出</button><button data-dir="1" class="${isIncome?'on':''}">収入</button></div>
    <label class="field"><span>金額(円)</span><input id="f-amt" inputmode="numeric" value="${t?Math.abs(t.value):''}" placeholder="0"></label>
    <label class="field"><span>店名・内容</span><input id="f-mer" value="${t?esc(t.merchant):''}"></label>
    <label class="field"><span>日付</span><input id="f-day" type="date" value="${d}"></label>
    ${rp?`<div class="field"><span>受け取った ${yen(t.value)} の振り分け</span>
      <div class="row" style="gap:10px;margin-top:6px"><label style="flex:1"><div class="sub">相殺する額(立替金・円)</div><input id="f-offamt" inputmode="numeric" value="${t.advance}"></label>
      <label style="flex:1"><div class="sub">お小遣いの額(円)</div><input id="f-alloc" inputmode="numeric" value="${t.allowance}"></label></div>
      <div class="sub" style="margin-top:6px">合計が受け取った額になります(片方を変えると、もう片方が自動で変わります)。相殺されていない立替金は「未相殺」として残ります。</div>
      <button class="btn ghost sm" style="margin-top:8px" data-allow-toggle>${t.allowSender?'この人を「お小遣いの人」から外す':'この人を「お小遣いの人」に追加する'}</button></div>`:`<div class="field"><span>カテゴリー</span><div class="chips" id="f-cats" style="flex-wrap:wrap">${chips()}</div></div>
    <div class="field" id="f-scope-box" style="${isIncome?'display:none':''}"><span>カテゴリーを変える範囲</span><div class="seg"><button data-scope="all" class="on">同じ店名すべて</button><button data-scope="one">この取引だけ</button></div><div class="sub" style="margin-top:6px">「サブスク」にするときだけは、同じ店名で、毎月(または毎年)の同じ頃(±3日)の取引が対象です(金額が大きく違うものは除きます)。同じ店の別の日の買い物は、サブスクになりません。</div></div>
    <div class="field" id="f-cyc-box" style="${cat0==='サブスク'?'':'display:none'}"><span>サブスクの周期</span><div class="seg"><button data-cyc="monthly" class="on">毎月</button><button data-cyc="yearly">毎年</button></div></div>`}
    ${t&&t.value>0?`<div class="field"><span>相殺(立て替えの返金・払い戻し)</span>${offLine(t)}</div>`:''}
    <button class="btn" data-save>${t?.review?'確定して保存':'保存'}</button>
    ${t?`<button class="btn danger" style="margin-top:10px" data-del>削除</button>`:''}
    ${t&&t.raw?`<div class="sub" style="margin-top:14px;word-break:break-all">OCR: ${esc(t.raw).slice(0,200)}</div>`:''}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener('input',ev=>{      // 相殺する額とお小遣いの額は、合計が受け取った額になるように、片方を変えるともう片方も変わる
    if(!rp) return;

function saveTx(id,{value,merchant,day,category,scope,cycle}){

/* 背面タップ・メールに渡す鍵: 合言葉から、一方向に作る「書き込み専用の鍵」。漏れても、読み出し・編集・削除はされない(Worker 版4以上)。古いWorkerのときは、合言葉をそのまま使う */
async function ingestSecret(){
  const key = S.cloud && S.cloud.key || '';
  if(!(cloudInfo && (cloudInfo.version||1) >= 4)) return key;
  const enc = new TextEncoder(), k = await crypto.subtle.importKey('raw', enc.encode(key), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
  return [...new Uint8Array(await crypto.subtle.sign('HMAC', k, enc.encode('kakeibo-ingest-v1')))].map(b=>b.toString(16).padStart(2,'0')).join('');
}
/* 公開元(release.json)の、最新のWorkerの版・必須の版・お知らせ。公開元が、全員に反映するかを選べる */
async function fetchRelease(){

    try{ const t = await (await fetch('worker.js',{cache:'no-store'})).text(); const m = /const VERSION = (\d+)/.exec(t); if(m) workerLatest = +m[1]; }catch(e2){}

/* クラウド: 初回は全件、以降は「前回から変わった分だけ」取得する(30分に1回は全件を取り直して、ずれを直す) */
async function loadCloud(manual){
  const needFull = !!manual || !S.cursor || (Date.now()-S.lastFull > 30*60*1000);
  const since = needFull ? null : S.cursor;
  let recs = [], cursor = null, serverTime = null, pages = 0;
  do{
    const q = [since?'since='+encodeURIComponent(since):'', cursor?'cursor='+encodeURIComponent(cursor):''].filter(Boolean).join('&');
    const res = await cloudFetch('/api/transactions'+(q?'?'+q:''));
    if(res.status===401){ if(manual) toast('合言葉が違います(設定タブで接続し直してください)'); return false; }
    if(!res.ok){ if(manual) toast('読み込みに失敗しました('+res.status+')'); return false; }
    const j = await res.json();
    const legacy = Array.isArray(j);                       // 古い中継役(配列をそのまま返す)にも対応
    recs = recs.concat(legacy ? j : (j.records||[])); serverTime = serverTime || (legacy ? new Date().toISOString() : j.server_time); cursor = legacy ? null : j.next; pages++;
  }while(cursor && pages<20);
  let changed;
  if(needFull){ changed = JSON.stringify(S.base)!==JSON.stringify(recs); S.base = recs; S.lastFull = Date.now(); }
  else{
    const m = new Map(S.base.map(t=>[t.id,t]));
    recs.forEach(r=>{ if(r.deleted) m.delete(r.id); else m.set(r.id,r); });
    S.base = [...m.values()]; changed = recs.length>0;
  }
  S.cursor = new Date(Date.parse(serverTime)-5*60*1000).toISOString();   // Notionの更新時刻は分単位なので、5分さかのぼって取りこぼしを防ぐ
  const n = new Date();
  S.meta.loadedAt = `${n.getMonth()+1}/${n.getDate()} ${pad(n.getHours())}:${pad(n.getMinutes())}`;
  S.meta.fileName = 'クラウド'; S.meta.linked = true;
  persist(); if(changed) render();
  return true;
}

async function pullSettings(){

    ls.x = e.clientX; ls.y = e.clientY;
    if(ls.active) dragApply(rowAt(e.clientX,e.clientY));
    else if(Math.hypot(e.clientX-ls.x0,e.clientY-ls.y0)>10){ clearTimeout(ls.timer); ls = null; }       // 長押しの前に動かしたら、ふつうの操作(スクロール・スライド)
  }
  if(!sw) return;
  const dx = e.clientX-sw.x0, dy = e.clientY-sw.y0;
  if(sw.lock===null){ if(Math.abs(dx)<8 && Math.abs(dy)<8) return; sw.lock = Math.abs(dx)>Math.abs(dy)*1.2 ? 'x' : 'y'; }
  if(sw.lock!=='x'){ sw = null; return; }
  sw.dx = dx; sw.fg.style.transition = 'none'; sw.fg.style.transform = `translateX(${dx}px)`;
  if(sw.fg.parentElement) sw.fg.parentElement.classList.toggle('armed', Math.abs(dx)>=SWIPE_MIN);
});
function endSwipe(){
  if(!sw) return; const s_ = sw; sw = null; if(s_.lock!=='x') return;
  swipedAt = Date.now();                                             // スライドの直後は、クリック(編集画面を開く動き)を無視する
  if(Math.abs(s_.dx) >= Math.min(SWIPE_MIN,(s_.fg.offsetWidth||300)*.3)){
    s_.fg.style.transition = 'transform .18s ease'; s_.fg.style.transform = `translateX(${s_.dx>0?'110%':'-110%'})`;
    setTimeout(()=>confirmOne(s_.id),170);
  }else{ s_.fg.style.transition = 'transform .2s ease'; s_.fg.style.transform = ''; if(s_.fg.parentElement) s_.fg.parentElement.classList.remove('armed'); }
}
document.addEventListener('pointerup',()=>{ endDrag(); endSwipe(); });
document.addEventListener('pointercancel',()=>{ endDrag(); endSwipe(); });
document.addEventListener('click',ev=>{
  if(Date.now()-swipedAt<350) return;
  const a = ev.target.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act;
  if(act==='mprev') shiftMonth(-1); else if(act==='mnext') shiftMonth(1);
  else if(act==='yprev'){ S.statY--; render(); } else if(act==='ynext'){ S.statY++; render(); }
  else if(act==='add') openSheet(null,a.dataset.day);
  else if(act==='edit') openSheet(a.dataset.id);
  else if(act==='review') S.hist.filter='review';
  else if(act==='advance') S.hist.filter='advance';
  else if(act==='set-toggle'){ S.setOpen = {...(S.setOpen||{}), [a.dataset.k]: !(S.setOpen||{})[a.dataset.k]}; render(); }
  else if(act==='app-update'){ (async()=>{ try{ const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r=>r.unregister())); const ks = await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }catch(e){} location.reload(); })(); }
  else if(act==='hist-latest'){ S.hist.upto = null; render(); }
  else if(act==='budget') openBudgetSheet();
  else if(act==='theme') setTheme(a.dataset.c);
  else if(act==='pick-day'){ S.selDay = a.dataset.d; render(); }
  else if(act==='today'){ S.cur = {y:today.getFullYear(),m:today.getMonth()+1}; S.selDay = ymd(today); render(); }
  else if(act==='sel-toggle'){ S.sel = {on:!S.sel.on, ids:[]}; render(); }
  else if(act==='sel-row'){ const id=a.dataset.id, i=S.sel.ids.indexOf(id); if(i>=0) S.sel.ids.splice(i,1); else S.sel.ids.push(id); render(); }
  else if(act==='sel-all'){ const {list,days}=histList(all()), shown=new Set(days); const ids=list.filter(t=>shown.has(t.day)).map(t=>t.id);
    S.sel.ids = S.sel.ids.length===ids.length ? [] : ids; render(); }
  else if(act==='sel-confirm'){ if(S.sel.ids.length){ const ids=S.sel.ids; S.sel.ids=[]; bulkApply(ids, confirmAs, '{n}件を確認済みにしました'); } }
  else if(act==='sel-cat'){ if(S.sel.ids.length) openCatPick([...S.sel.ids]); }
  else if(act==='sel-del'){ if(S.sel.ids.length && confirm(`${S.sel.ids.length}件を削除します。よろしいですか?`)){ const ids=S.sel.ids; S.sel.ids=[]; bulkDelete(ids); } }
  else if(act==='pick-csv') document.getElementById('csv-in').click();
  else if(act==='kw-add') openKwSheet(a.dataset.k||'income');
  else if(act==='kw-del'){ const key = a.dataset.k==='cardpay' ? 'cardPayKw' : a.dataset.k==='allow' ? 'allowKw' : a.dataset.k==='p2p' ? 'ufjP2pKw' : 'ufjIncomeKw'; if(key==='allowKw') S.settings.allowKw=[...allowKws()]; if(key==='cardPayKw' && !S.settings.cardPayKw) S.settings.cardPayKw=[...DEFAULT_CARDPAY]; S.settings[key]=(S.settings[key]||[]).filter((_,i)=>i!==+a.dataset.i); persist(); markSettings(); render(); }
  else if(act==='cat-add') openCategorySheet();
  else if(act==='rule-add') openRuleSheet();
  else if(act==='cat-del'){ const n=a.dataset.n; if(confirm(`カテゴリー「${n}」を削除します。\nこのカテゴリーのルールと予算も消えます。このカテゴリーに入っていた取引は、判定し直されます。`)){
      S.settings.cats=(S.settings.cats||[]).filter(c=>c.name!==n); S.settings.rules=(S.settings.rules||[]).filter(r=>r.cat!==n);
      if(S.settings.budgets) delete S.settings.budgets[n]; if(S.settings.fallbackCat===n) S.settings.fallbackCat='食費';
      Object.keys(S.overlay.edits).forEach(k=>{ if(S.overlay.edits[k].category===n) delete S.overlay.edits[k].category; });
      rebuildCats(); persist(); markSettings(); render(); } }
  else if(act==='rule-del'){ S.settings.rules=(S.settings.rules||[]).filter((_,i)=>i!==+a.dataset.i); persist(); markSettings(); render(); }
  else if(act==='filter'){ S.hist.filter=a.dataset.v; render(); }
  else if(act==='pick-fs') pickFS();
  else if(act==='pick-input') document.getElementById('fin').click();
  else if(act==='reload') reloadFS(true);
  else if(act==='reload-local'){ lastLocalText=null; loadLocal(true); toast('再読み込みしました'); }
  else if(act==='connect'){ const u=document.getElementById('c-url').value, k=document.getElementById('c-key').value; if(!/^https:\/\//.test(u.trim())||!k.trim()){ toast('URL(https://…)と合言葉を入れてください'); } else { connectCloud(u,k); toast('接続しました'); } }
  else if(act==='sub-gone'){ const k = a.dataset.k; if(!confirm('このサブスクを完全に消しますか?カテゴリーも、元に戻ります。')) return;
    S.settings.subGone = [...new Set([...(S.settings.subGone||[]), k])]; S.settings.subIgnore = (S.settings.subIgnore||[]).filter(x=>x!==k); if(!/[@#]/.test(k)) S.learned[k] = null; persist(); render(); markSettings(); }
  else if(act==='sub-ignore'||act==='sub-restore'){ const k=a.dataset.k, l=new Set(S.settings.subIgnore||[]); act==='sub-ignore'?l.add(k):l.delete(k); S.settings.subIgnore=[...l]; persist(); render(); markSettings(); }
  else if(act==='setup-genkey'){ setupRead(); const b=new Uint8Array(24); crypto.getRandomValues(b); SETUP.key=[...b].map(x=>'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%56]).join(''); render(); }
  else if(act==='setup-copykey'){ setupRead(); if(!SETUP.key) toast('先に合言葉を作ってください'); else { try{ navigator.clipboard.writeText(SETUP.key).then(()=>toast('コピーしました')); }catch(e){ toast('コピーできませんでした。手で選んでコピーしてください'); } } }
  else if(act==='setup-copycode'){ fetch('worker.js',{cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.text(); }).then(t=>navigator.clipboard.writeText(t)).then(()=>toast('コピーしました。Cloudflareの画面に貼り付けてください'),()=>toast('コピーできませんでした。もう一度押してください')); }
  else if(act==='setup-connect') setupConnect();
  else if(act==='setup-skip'){ S.meta.setupSkip = true; persist(); render(); }
  else if(act==='tap-copy-url'||act==='tap-copy-key'){ (async()=>{ if(!cloudInfo) await loadCloudInfo(); const v = act==='tap-copy-url' ? (S.cloud&&S.cloud.url||'').replace(/\/+$/,'') : (S.cloud ? await ingestSecret() : ''); if(!v) return toast('クラウドに接続していません'); try{ await navigator.clipboard.writeText(v); toast('コピーしました'); }catch(e){ toast('コピーできませんでした'); } })(); }
  else if(act==='copy-connect-link'){ const j = JSON.stringify({url:S.cloud.url.replace(/\/+$/,''),key:S.cloud.key}); const b = btoa(unescape(encodeURIComponent(j))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); const link = location.origin+location.pathname+'#/connect/'+b; try{ navigator.clipboard.writeText(link).then(()=>toast('コピーしました。ほかの端末で開いてください')); }catch(e){ toast('コピーできませんでした'); } }
  else if(act==='mail-copy-script'){ (async()=>{ try{ if(!cloudInfo) await loadCloudInfo(); const t = await (await fetch('mail.gs',{cache:'no-store'})).text(); await navigator.clipboard.writeText(t.replace('__WORKER_URL__',S.cloud.url.replace(/\/+$/,'')).replace('__APP_KEY__',await ingestSecret())); toast('コピーしました。Apps Scriptに貼り付けてください'); }catch(e){ toast('コピーできませんでした。もう一度押してください'); } })(); }
  else if(act==='release-seen'){ S.meta.seenRelease = RELEASE && RELEASE.id; persist(); render(); }
  else if(act==='cloud-info') loadCloudInfo();
  else if(act==='cloud-migrate') migrateToD1();
  else if(act==='disconnect'){ S.cloud=null; lastLocalText=null; S.cursor=null; persist(); render(); toast('接続を解除しました'); }
  else if(act==='save') saveOut();
  else if(act==='sample') sample();
  else if(act==='clear'){ if(confirm('この端末に保存したデータを消去します(Box上のファイルは消えません)')){ try{localStorage.removeItem(LS);}catch(e){} S.base=[]; S.overlay={edits:{},added:[],deleted:[]}; S.learned={}; S.meta={loadedAt:null,fileName:null,linked:false}; render(); } }
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='hist-q'){            // 打つたびに、一覧だけを更新する(入力欄は作り直さない)
    S.hist.q = ev.target.value;
    const L = histList(all()), box = document.getElementById('hist-list'), note = document.getElementById('hist-note');
    if(box) box.innerHTML = histDays(L,S.sel.on);
    if(note) note.innerHTML = histNote(L);
  }
});
document.addEventListener('change',async ev=>{
  if(ev.target.id==='hist-jump'){ S.hist.upto = ev.target.value || null; render(); window.scrollTo && window.scrollTo(0,0); return; }
  if(ev.target.id==='theme-color'){ setTheme(ev.target.value); return; }
  if(ev.target.id==='csv-in'){ const fl=[...ev.target.files]; ev.target.value=''; if(fl.length) await importCsvFiles(fl); return; }
  if(ev.target.id==='fin'){ const f=ev.target.files[0]; if(f){ ingestJson(await f.text(), f.name); toast('読み込みました'); } }
  if(ev.target.dataset?.act==='p2p'){ S.settings.p2pIn=ev.target.checked; persist(); render(); markSettings(); }
  if(ev.target.dataset?.act==='ufjonly'){ S.settings.ufjIncomeOnly=ev.target.checked; persist(); markSettings(); render(); }
  if(ev.target.dataset?.act==='fallback'){ S.settings.fallbackCat=ev.target.value; persist(); markSettings(); render(); }
  if(ev.target.dataset?.act==='skippoints'){ S.settings.csvSkipPoints=ev.target.checked; persist(); render(); }
  if(ev.target.dataset?.act==='cardpay'){ S.settings.cardPayExclude=ev.target.checked; persist(); render(); markSettings(); }
  if(ev.target.dataset?.act==='transfer'){ S.settings.transfer=ev.target.checked; persist(); render(); markSettings(); }
});
/* パソコン用のキー操作: ←→ 月の切り替え / T 今日 / N 取引を追加 */
document.addEventListener('keydown',e=>{
  const tg = e.target; if(tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
  if(e.metaKey||e.ctrlKey||e.altKey||document.querySelector('.sheet-bg')) return;
  const {p} = route(), k = e.key;
  if(k==='ArrowLeft' && (p==='cal'||p==='stats')) shiftMonth(-1);
  else if(k==='ArrowRight' && (p==='cal'||p==='stats')) shiftMonth(1);
  else if((k==='t'||k==='T') && p==='cal'){ S.cur = {y:today.getFullYear(),m:today.getMonth()+1}; S.selDay = ymd(today); render(); }
  else if(k==='n'||k==='N'){ e.preventDefault && e.preventDefault(); openSheet(null); }
});
try{ window.addEventListener('resize',()=>fitAmounts()); }catch(_){}
try{ window.matchMedia('(min-width:960px)').addEventListener('change',()=>render()); }catch(_){}      // ウィンドウの幅が変わったら、画面の作りを切り替える
window.addEventListener('hashchange',()=>{ S.sel={on:false,ids:[]}; render(); window.scrollTo(0,0); });

/* ========= 起動 ========= */
restore();
/* 設定の移行(1・2): 以前は、作者個人の言葉を、初期値として足していた。いまは、個人の言葉は持たない(保存済みの設定は、そのまま残る) */
if((S.settings.ver||0) < 2){ S.settings.ver = 2; persist(); }
/* 設定の移行(3): 以前の「店名だけで、すべてサブスク」の学習は、同じ店の買い物まで巻き込むので外す(必要なら、金額つきで登録し直す) */
if((S.settings.ver||0) < 3){
  Object.keys(S.learned).forEach(k=>{ if(S.learned[k]==='サブスク'){ if(cloud()) S.learned[k] = null; else delete S.learned[k]; } });
  S.settings.ver = 3; persist();
}
rebuildCats();
applyTheme();
render();
handleConnectLink();
if(cloud()) setTimeout(checkWorkerVersion, 3000); else setTimeout(fetchRelease, 3000);          // 起動の少しあとに、データの置き場所の版を確かめる(古ければ、設定に案内が出る)
if(AUTO()) loadLocal().then(()=>applyLocal());          // 起動時: 読み込み → 前回の未保存分があれば反映
setInterval(()=>{ if(AUTO()) loadLocal(); }, cloud()?60000:15000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && AUTO()) loadLocal(); });
(async()=>{
  if(AUTO()) return;
  try{ S.handle = await idbGet('handle') || null; if(S.handle){ S.meta.linked=true; reloadFS(false); } }catch(e){}
  setInterval(()=>reloadFS(false),30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) reloadFS(false); });
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
